name: Release

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22]

        services:
            postgres:
                image: postgres:15-alpine
                ports:
                    - 5432:5432
                env:
                    POSTGRES_USER: casbin
                    POSTGRES_PASSWORD: casbin
                    POSTGRES_DB: casbin
                options: >-
                    --health-cmd="pg_isready -U casbin"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20

            mysql:
                image: mysql:8
                ports:
                    - 3306:3306
                env:
                    MYSQL_ROOT_PASSWORD: casbin
                    MYSQL_DATABASE: casbin
                # `mysqladmin ping` reports ready ~30s before the server will
                # accept a query, so health-check with an actual query.
                options: >-
                    --health-cmd="mysql -uroot -pcasbin -e 'select 1' casbin"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=30

        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm i

            - name: Run test
              run: |
                  export DATABASE_URL=postgres://casbin:casbin@localhost:5432/casbin?sslmode=disable
                  export MYSQL_URL=mysql://root:casbin@127.0.0.1:3306/casbin
                  pnpm push
                  pnpm format:check
                  pnpm lint
                  pnpm typecheck
                  pnpm build
                  pnpm test run

    release:
        needs: test
        if: github.event_name == 'push'
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22]

        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "pnpm"

            - name: Install NPM Dependencies
              run: pnpm install

            - name: Build the package
              run: pnpm build

            - name: Create Version PR or Publish to NPM
              id: changesets
              uses: changesets/action@v1
              with:
                  commit: "chore(release): version packages"
                  title: "chore(release): version packages"
                  version: pnpm changeset version
                  publish: pnpm changeset publish
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
